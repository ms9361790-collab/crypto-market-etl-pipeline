name: Daily Crypto ETL

on:
  schedule:
    - cron: '30 3 * * *' # Roz subah 9:00 AM IST (3:30 AM UTC)
  workflow_dispatch:       # Manual test run karne ke liye button

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ETL Pipeline
        run: python etl_pipeline.py

      - name: Commit and Push Updated Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add crypto_market.db latest_market_data.csv daily_chart.png
          git diff --staged --quiet || git commit -m "Automated Daily Crypto ETL Update"
          git push
